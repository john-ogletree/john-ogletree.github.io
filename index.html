<style>
/* ---------- RESET & BASE ---------- */
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background-color: #0d1117;
color: #c9d1d9;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 24px;
margin: 0;

/* ---------- UTILITY CLASSES ---------- */
/* Layout */
.container { max-width: 560px; width: 100%; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 8px; }
.gap-2 { gap: 12px; }
.gap-3 { gap: 16px; }
.gap-4 { gap: 24px; }
.text-center { text-align: center; }
.mx-auto { margin-left: auto; margin-right: auto; }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 12px; }
.mt-3 { margin-top: 16px; }
.mt-4 { margin-top: 24px; }
.mt-5 { margin-top: 32px; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 12px; }
.mb-3 { margin-bottom: 16px; }
.mb-4 { margin-bottom: 24px; }
.w-full { width: 100%; }
.max-w-360 { max-width: 360px; }

/* Typography */
.text-white { color: #ffffff; }
.text-muted { color: #8b949e; }
.text-orange { color: #d29922; }
.text-sm { font-size: 0.85rem; }
.text-xs { font-size: 0.7rem; }
.text-base { font-size: 1rem; }
.text-lg { font-size: 1.6rem; }
.font-mono { font-family: 'Courier New', Courier, monospace; }
.font-bold { font-weight: 700; }
.font-medium { font-weight: 450; }
.tracking-wide { letter-spacing: 0.3px; }
.tracking-tight { letter-spacing: -0.3px; }
.uppercase { text-transform: uppercase; }
.leading-normal { line-height: 1.5; }
.leading-relaxed { line-height: 1.6; }

/* Spacing & Sizing */
.p-1 { padding: 4px 14px 4px 12px; }
.p-2 { padding: 12px 16px; }
.p-3 { padding: 14px 20px; }
.py-1 { padding-top: 6px; padding-bottom: 6px; }
.py-2 { padding-top: 12px; padding-bottom: 12px; }
.px-2 { padding-left: 16px; padding-right: 16px; }
.w-7 { width: 28px; }
.w-6 { width: 24px; }
.h-96 { height: 96px; width: 96px; }
.h-7 { height: 7px; width: 7px; }

/* Borders & Radius */
.border { border: 1px solid #30363d; }
.border-orange { border-color: rgba(210, 153, 34, 0.3); }
.border-orange-hover:hover { border-color: #d29922; }
.rounded-full { border-radius: 9999px; }
.rounded-2xl { border-radius: 16px; }
.rounded-full { border-radius: 50%; }
.border-t { border-top: 1px solid #30363d; }

/* Backgrounds */
.bg-orange-soft { background: rgba(210, 153, 34, 0.12); }
.bg-link { background: rgba(255, 255, 255, 0.04); }
.bg-link-hover:hover { background: rgba(210, 153, 34, 0.08); }
.bg-avatar { background: #1f2429; }

/* Interactive */
.transition { transition: background 0.2s, border-color 0.2s, transform 0.1s; }
.hover-scale:hover { transform: scale(1.01); }
.hover-scale:active { transform: scale(0.98); }
.hover-arrow:hover .arrow { transform: translateX(4px); color: #d29922; }

/* Status badge */
.inline-flex { display: inline-flex; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }

/* Animation */
@keyframes pulse {
0% { opacity: 1; }
50% { opacity: 0.25; }
100% { opacity: 1; }
}
.animate-pulse { animation: pulse 2s infinite; }

/* Misc */
.object-cover { object-fit: cover; }
.flex-shrink-0 { flex-shrink: 0; }
.no-underline { text-decoration: none; }
.opacity-70 { opacity: 0.7; }
.border-dotted { border-bottom: 1px dotted #30363d; }
.hover-border-orange:hover { border-bottom-color: #d29922; }
.hover-text-orange:hover { color: #d29922; }
.inline-block { display: inline-block; }

/* Responsive */
@media (max-width: 460px) {
.text-lg-responsive { font-size: 1.4rem; }
.p-3-responsive { padding: 12px 16px; }
.w-6-responsive { width: 24px; }
}
</style>
