<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>John Ogletree · watch</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent scroll on watch */
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            margin: 0;
            font-size: 8px; /* Base size for watch */
        }

        /* ---------- UTILITY CLASSES (micro) ---------- */
        .container { 
            width: 100%;
            max-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-row { flex-direction: row; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 2px; }
        .gap-2 { gap: 3px; }
        .gap-3 { gap: 4px; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .flex-shrink-0 { flex-shrink: 0; }
        .flex-1 { flex: 1; }

        /* Typography - tiny */
        .text-white { color: #ffffff; }
        .text-muted { color: #8b949e; }
        .text-orange { color: #d29922; }
        .text-xs { font-size: 6px; }
        .text-sm { font-size: 7px; }
        .text-base { font-size: 8px; }
        .text-lg { font-size: 10px; }
        .text-xl { font-size: 12px; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'Courier New', Courier, monospace; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .leading-tight { line-height: 1.2; }

        /* Spacing - micro */
        .p-1 { padding: 2px 4px; }
        .p-2 { padding: 3px 5px; }
        .mt-1 { margin-top: 2px; }
        .mb-1 { margin-bottom: 2px; }

        /* Borders */
        .border { border: 0.5px solid #30363d; }
        .border-orange { border-color: rgba(210, 153, 34, 0.4); }
        .rounded-full { border-radius: 9999px; }
        .rounded-md { border-radius: 4px; }

        /* Avatar - tiny */
        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(210, 153, 34, 0.4);
            background: #1f2429;
            flex-shrink: 0;
        }

        /* Status dot - tiny */
        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #d29922;
            display: inline-block;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* Links - ultra compact grid */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            flex: 1;
            align-content: start;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid #30363d;
            border-radius: 4px;
            padding: 2px 1px;
            text-decoration: none;
            color: #c9d1d9;
            transition: background 0.1s;
            min-height: 28px;
            gap: 1px;
        }

        .link-item:active {
            background: rgba(210, 153, 34, 0.15);
            transform: scale(0.95);
        }

        .link-icon {
            font-size: 10px;
            line-height: 1;
        }

        .link-label {
            font-size: 5px;
            opacity: 0.8;
            text-align: center;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Status badge - mini */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(210, 153, 34, 0.12);
            color: #d29922;
            border: 0.5px solid rgba(210, 153, 34, 0.2);
            padding: 1px 6px;
            border-radius: 9999px;
            font-size: 5px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Footer - minimal */
        .footer {
            border-top: 0.5px solid #30363d;
            padding-top: 2px;
            font-size: 5px;
            color: #8b949e;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: space-between;
            opacity: 0.6;
        }

        .footer a {
            color: #8b949e;
            text-decoration: none;
        }

        /* ---------- WATCH-SPECIFIC BREAKPOINTS ---------- */
        /* Apple Watch (approx 184px - 200px) */
        @media (max-width: 200px) {
            body { font-size: 7px; padding: 3px; }
            .avatar { width: 20px; height: 20px; }
            .link-grid { grid-template-columns: repeat(3, 1fr); gap: 2px; }
            .link-icon { font-size: 9px; }
            .link-label { font-size: 4.5px; }
            .text-lg { font-size: 9px; }
            .text-base { font-size: 7px; }
            .text-sm { font-size: 6px; }
            .badge { font-size: 4.5px; padding: 1px 4px; }
            .footer { font-size: 4.5px; }
            .link-item { min-height: 24px; padding: 1px 1px; }
        }

        /* Very small watches (under 150px) */
        @media (max-width: 150px) {
            body { font-size: 6px; padding: 2px; }
            .avatar { width: 16px; height: 16px; }
            .link-grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
            .link-icon { font-size: 8px; }
            .link-label { font-size: 4px; }
            .text-lg { font-size: 8px; }
            .text-base { font-size: 6px; }
            .text-sm { font-size: 5px; }
            .badge { font-size: 4px; padding: 1px 3px; }
            .footer { font-size: 4px; flex-direction: column; align-items: center; text-align: center; }
            .link-item { min-height: 20px; padding: 1px; }
            .gap-1 { gap: 1px; }
            .gap-2 { gap: 2px; }
            .p-1 { padding: 1px 2px; }
        }

        /* Tiny square watches (like some Wear OS) */
        @media (max-width: 130px) {
            .link-grid { grid-template-columns: repeat(2, 1fr); gap: 1px; }
            .link-item { min-height: 16px; border-radius: 2px; }
            .link-icon { font-size: 6px; }
            .link-label { font-size: 3.5px; }
            .avatar { width: 12px; height: 12px; }
            .badge { display: none; } /* Hide badge on super tiny screens */
            .footer { display: none; } /* Hide footer on super tiny screens */
            .text-lg { font-size: 7px; }
            .container { gap: 1px; }
        }

        /* Round watch face support - safe area padding */
        @supports (padding: max(0px)) {
            body {
                padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) 
                         max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
            }
        }
    </style>
</head>
