<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>John Ogletree · link-in-bio</title>
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #0a0a0f;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(6px, 1.5vh, 24px);
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* subtle noise overlay via gradient + pseudo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(210, 153, 34, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(108, 92, 231, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(0, 255, 65, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      height: 100%;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.6vh, 12px);
      overflow-y: auto;
      padding: clamp(2px, 0.4vh, 8px) 0;
      position: relative;
      z-index: 1;
    }

    .container::-webkit-scrollbar {
      width: 3px;
    }
    .container::-webkit-scrollbar-track {
      background: transparent;
    }
    .container::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    /* ---------- SCANLINE OVERLAY ---------- */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 4px);
      opacity: 0.3;
    }

    /* ---------- PROFILE (coffee/warm) ---------- */
    .profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2px, 0.3vh, 6px);
      flex-shrink: 0;
      position: relative;
      padding-top: clamp(12px, 1.8vh, 28px);
      background: rgba(212, 163, 115, 0.04);
      border-radius: clamp(8px, 1vh, 16px);
      border: 1px solid rgba(212, 163, 115, 0.08);
      padding: clamp(12px, 1.8vh, 28px) clamp(12px, 1.8vh, 28px) clamp(8px, 1vh, 16px);
    }

    .profile::before {
      content: '☕';
      position: absolute;
      top: clamp(4px, 0.6vh, 10px);
      left: clamp(10px, 1.5vw, 24px);
      font-size: clamp(14px, 1.6vh, 22px);
      opacity: 0.3;
      transform: rotate(-8deg);
    }

    .profile::after {
      content: '✦';
      position: absolute;
      bottom: clamp(4px, 0.6vh, 10px);
      right: clamp(10px, 1.5vw, 24px);
      font-size: clamp(12px, 1.4vh, 18px);
      opacity: 0.2;
      color: #d4a373;
    }

    .profile .tape-top {
      position: absolute;
      top: clamp(-3px, -0.2vh, 2px);
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: clamp(24px, 4vw, 56px);
      height: clamp(10px, 1.2vh, 20px);
      background: rgba(212, 163, 115, 0.15);
      border: 1px solid rgba(212, 163, 115, 0.08);
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      opacity: 0.5;
      z-index: 2;
      pointer-events: none;
    }

    .avatar {
      width: clamp(48px, 8vh, 80px);
      height: clamp(48px, 8vh, 80px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(212, 163, 115, 0.4);
      background: #1f2429;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 30px rgba(212, 163, 115, 0.1);
    }

    .profile h1 {
      font-size: clamp(18px, 2.2vh, 28px);
      font-weight: 700;
      color: #f0e6d3;
      letter-spacing: -0.3px;
      line-height: 1.2;
      position: relative;
      z-index: 1;
      font-family: 'Courier New', Courier, monospace;
    }

    .profile h1 .cursor {
      display: inline-block;
      width: 2px;
      height: 0.8em;
      background: #d4a373;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    .philosophy-tagline {
      font-size: clamp(11px, 1.2vh, 15px);
      color: #d4a373;
      font-weight: 400;
      letter-spacing: 0.3px;
      opacity: 0.8;
      position: relative;
      z-index: 1;
      max-width: 450px;
      margin: 0 auto;
      line-height: 1.4;
      padding: 0 clamp(8px, 1vw, 16px);
      font-family: 'Courier New', Courier, monospace;
    }

    .philosophy-tagline .divider {
      color: #6c5ce7;
      opacity: 0.4;
      margin: 0 4px;
    }

    .profile .steam {
      font-size: clamp(8px, 0.8vh, 12px);
      opacity: 0.2;
      letter-spacing: 4px;
      margin-top: 2px;
      animation: float 3s ease-in-out infinite;
      font-family: 'Courier New', Courier, monospace;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
        opacity: 0.2;
      }
      50% {
        transform: translateY(-3px);
        opacity: 0.5;
      }
    }

    /* ---------- GRID ---------- */
    .link-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(4px, 0.4vh, 8px);
      width: 100%;
      flex-shrink: 0;
    }

    /* ---------- LINK ITEMS (base) ---------- */
    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: clamp(6px, 0.7vh, 12px);
      padding: clamp(6px, 0.7vh, 14px) clamp(10px, 1.2vw, 20px);
      text-decoration: none;
      color: #c9d1d9;
      font-size: clamp(12px, 1.3vh, 17px);
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, transform 0.1s, box-shadow 0.2s;
      text-align: center;
      width: 100%;
      min-height: clamp(36px, 4.5vh, 52px);
      cursor: pointer;
      position: relative;
      gap: clamp(4px, 0.5vh, 12px);
      flex-wrap: wrap;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
    }

    .link-item:hover {
      transform: scale(1.02);
    }

    .link-item:active {
      transform: scale(0.97);
    }

    .link-item:focus-visible {
      outline: 2px solid #d4a373;
      outline-offset: 2px;
    }

    .link-label {
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .link-label.mono {
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0.5px;
      font-size: 0.9em;
    }

    .link-handle-tape {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: clamp(1px, 0.15vh, 4px) clamp(4px, 0.5vw, 12px);
      border-radius: 3px;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(7px, 0.7vh, 12px);
      color: #8b949e;
      letter-spacing: 0.2px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      transform: rotate(-0.5deg);
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .link-handle-tape .handle-icon {
      opacity: 0.6;
      font-size: 0.85em;
    }

    .link-handle-tape .handle-text {
      color: #c9d1d9;
      font-weight: 400;
    }

    /* ============================================================
       SECTION-SPECIFIC THEMES
       ============================================================ */

    /* ----- SOCIAL: arcade neon ----- */
    .link-item.social {
      background: rgba(255, 107, 107, 0.04);
      border-color: rgba(255, 107, 107, 0.08);
    }
    .link-item.social:hover {
      background: rgba(255, 107, 107, 0.08);
      border-color: rgba(255, 107, 107, 0.25);
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.06), inset 0 0 20px rgba(255, 107, 107, 0.03);
    }
    .link-item.social .link-handle-tape {
      background: rgba(255, 107, 107, 0.06);
      border-color: rgba(255, 107, 107, 0.08);
    }
    .link-item.social:hover .link-handle-tape {
      background: rgba(255, 107, 107, 0.1);
      border-color: rgba(255, 107, 107, 0.2);
    }

    /* ----- MUSIC: vinyl/purple ----- */
    .link-item.music {
      background: rgba(108, 92, 231, 0.04);
      border-color: rgba(108, 92, 231, 0.08);
    }
    .link-item.music:hover {
      background: rgba(108, 92, 231, 0.08);
      border-color: rgba(108, 92, 231, 0.25);
      box-shadow: 0 0 20px rgba(108, 92, 231, 0.06), inset 0 0 20px rgba(108, 92, 231, 0.03);
    }
    .link-item.music .link-handle-tape {
      background: rgba(108, 92, 231, 0.06);
      border-color: rgba(108, 92, 231, 0.08);
    }
    .link-item.music:hover .link-handle-tape {
      background: rgba(108, 92, 231, 0.1);
      border-color: rgba(108, 92, 231, 0.2);
    }

    /* ----- DEV: terminal/green ----- */
    .link-item.dev {
      background: rgba(0, 255, 65, 0.03);
      border-color: rgba(0, 255, 65, 0.06);
      font-family: 'Courier New', Courier, monospace;
    }
    .link-item.dev:hover {
      background: rgba(0, 255, 65, 0.06);
      border-color: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.04), inset 0 0 20px rgba(0, 255, 65, 0.02);
    }
    .link-item.dev .link-handle-tape {
      background: rgba(0, 255, 65, 0.04);
      border-color: rgba(0, 255, 65, 0.06);
    }
    .link-item.dev:hover .link-handle-tape {
      background: rgba(0, 255, 65, 0.08);
      border-color: rgba(0, 255, 65, 0.15);
    }
    .link-item.dev .link-label {
      color: #00ff41;
    }
    .link-item.dev .link-label::before {
      content: '$ ';
      opacity: 0.4;
      font-weight: 400;
    }

    /* ----- STORE: vintage/warm ----- */
    .link-item.store {
      background: rgba(212, 163, 115, 0.04);
      border-color: rgba(212, 163, 115, 0.08);
    }
    .link-item.store:hover {
      background: rgba(212, 163, 115, 0.08);
      border-color: rgba(212, 163, 115, 0.25);
      box-shadow: 0 0 20px rgba(212, 163, 115, 0.06);
    }
    .link-item.store .link-handle-tape {
      background: rgba(212, 163, 115, 0.06);
      border-color: rgba(212, 163, 115, 0.08);
    }
    .link-item.store:hover .link-handle-tape {
      background: rgba(212, 163, 115, 0.1);
      border-color: rgba(212, 163, 115, 0.2);
    }

    /* ----- CLIENTS: film/red-gold ----- */
    .link-item.client {
      background: rgba(255, 215, 0, 0.04);
      border-color: rgba(255, 215, 0, 0.06);
    }
    .link-item.client:hover {
      background: rgba(255, 215, 0, 0.08);
      border-color: rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
    }
    .link-item.client .link-handle-tape {
      background: rgba(255, 215, 0, 0.04);
      border-color: rgba(255, 215, 0, 0.06);
    }
    .link-item.client:hover .link-handle-tape {
      background: rgba(255, 215, 0, 0.08);
      border-color: rgba(255, 215, 0, 0.15);
    }

    /* ----- SUPPORT: warm/human ----- */
    .link-item.support {
      background: rgba(255, 107, 107, 0.03);
      border-color: rgba(255, 107, 107, 0.06);
    }
    .link-item.support:hover {
      background: rgba(255, 107, 107, 0.07);
      border-color: rgba(255, 107, 107, 0.2);
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.05);
    }
    .link-item.support .link-handle-tape {
      background: rgba(255, 107, 107, 0.04);
      border-color: rgba(255, 107, 107, 0.06);
    }
    .link-item.support:hover .link-handle-tape {
      background: rgba(255, 107, 107, 0.08);
      border-color: rgba(255, 107, 107, 0.15);
    }

    /* ----- DISABLED ----- */
    .link-item.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.04);
      filter: grayscale(0.5);
      pointer-events: none;
      user-select: none;
    }
    .link-item.disabled .link-label {
      opacity: 0.6;
    }
    .link-item.disabled .link-handle-tape {
      opacity: 0.5;
    }
    .link-item.disabled .link-label::after {
      content: ' · SOON';
      font-size: 0.6em;
      opacity: 0.5;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* ----- DEMO BADGE ----- */
    .link-item.demo .link-label::after {
      content: ' · DEMO';
      font-size: 0.6em;
      opacity: 0.6;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #d4a373;
    }

    /* ----- CATEGORY DIVIDER (themed) ----- */
    .category-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: clamp(2px, 0.2vh, 6px) 0;
      color: #8b949e;
      font-size: clamp(8px, 0.7vh, 12px);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', Courier, monospace;
      opacity: 0.4;
      flex-shrink: 0;
      grid-column: 1 / -1;
    }

    .category-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #30363d;
    }

    .category-divider::before {
      content: '';
      flex: 1;
      height: 1px;
      background: #30363d;
    }

    /* category-specific divider icons */
    .category-divider.social::before {
      content: '🕹 ';
    }
    .category-divider.music::before {
      content: '🎵 ';
    }
    .category-divider.dev::before {
      content: '💻 ';
    }
    .category-divider.store::before {
      content: '🏷 ';
    }
    .category-divider.client::before {
      content: '🎬 ';
    }
    .category-divider.support::before {
      content: '❤️ ';
    }

    /* ---------- PRIVACY NOTICE (hacker/terminal) ---------- */
    .privacy-notice {
      text-align: center;
      padding: clamp(4px, 0.5vh, 12px) clamp(6px, 0.8vw, 16px);
      border-radius: clamp(6px, 0.7vh, 12px);
      background: rgba(0, 255, 65, 0.03);
      border: 1px solid rgba(0, 255, 65, 0.06);
      flex-shrink: 0;
      margin-top: auto;
      position: relative;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    .privacy-notice::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          rgba(0, 255, 65, 0) 0px,
          rgba(0, 255, 65, 0) 2px,
          rgba(0, 255, 65, 0.02) 2px,
          rgba(0, 255, 65, 0.02) 4px);
      pointer-events: none;
    }

    .privacy-notice p {
      font-size: clamp(8px, 0.8vh, 13px);
      color: #8b949e;
      line-height: 1.4;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .privacy-notice .highlight {
      color: #00ff41;
      font-weight: 500;
    }

    .privacy-notice .highlight.accent {
      color: #d4a373;
    }

    .privacy-notice .mono {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95em;
    }

    .privacy-notice .blink-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #00ff41;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    /* ============================================================
       RESPONSIVE GRID: 1 → 2 → 3 → 4
       ============================================================ */

    @media (min-width: 480px) {
      .link-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 820px) {
      .link-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .link-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ---------- MOBILE ADJUSTMENTS ---------- */
    @media (max-width: 479px) {
      .link-item {
        min-height: clamp(38px, 4.5vh, 52px);
        padding: clamp(4px, 0.5vh, 12px) clamp(4px, 0.5vw, 12px);
        font-size: clamp(10px, 1.1vh, 15px);
        border-radius: clamp(5px, 0.6vh, 12px);
        flex-direction: column;
        gap: clamp(1px, 0.15vh, 4px);
      }
      .link-handle-tape {
        font-size: clamp(6px, 0.5vh, 10px);
        padding: clamp(1px, 0.1vh, 3px) clamp(3px, 0.3vw, 8px);
        transform: rotate(0deg);
      }
      .link-item.disabled .link-label::after {
        content: ' · SOON';
        font-size: 0.5em;
      }
      .link-item.demo .link-label::after {
        content: ' · DEMO';
        font-size: 0.5em;
      }
      .link-label.mono {
        font-size: 0.85em;
      }
    }

    @media (max-width: 400px) {
      .link-grid {
        gap: 4px;
      }
      .link-item {
        font-size: clamp(8px, 0.9vh, 12px);
        min-height: clamp(32px, 3.8vh, 44px);
        padding: clamp(3px, 0.4vh, 8px) clamp(3px, 0.4vw, 8px);
        gap: 1px;
      }
      .link-handle-tape {
        font-size: clamp(5px, 0.4vh, 9px);
        padding: 1px 2px;
      }
      .link-item.disabled .link-label::after {
        content: ' · SOON';
        font-size: 0.45em;
      }
      .link-item.demo .link-label::after {
        content: ' · DEMO';
        font-size: 0.45em;
      }
      .link-label.mono {
        font-size: 0.8em;
      }
      .category-divider {
        font-size: clamp(6px, 0.5vh, 9px);
      }
      .avatar {
        width: clamp(36px, 6vh, 48px);
        height: clamp(36px, 6vh, 48px);
      }
      .profile h1 {
        font-size: clamp(14px, 1.8vh, 18px);
      }
      .philosophy-tagline {
        font-size: clamp(8px, 0.8vh, 11px);
        padding: 0 clamp(4px, 0.5vw, 8px);
      }
      .privacy-notice p {
        font-size: clamp(7px, 0.6vh, 10px);
      }
      .profile {
        padding: clamp(8px, 1.2vh, 16px) clamp(8px, 1.2vw, 16px) clamp(6px, 0.8vh, 12px);
      }
      .profile .tape-top {
        width: clamp(18px, 3vw, 36px);
        height: clamp(8px, 0.8vh, 14px);
        top: clamp(-2px, -0.1vh, 2px);
      }
    }

    @media (max-width: 320px) {
      .link-grid {
        gap: 3px;
      }
      .link-item {
        font-size: 7px;
        min-height: 26px;
        padding: 2px 2px;
        border-radius: 3px;
        gap: 1px;
      }
      .link-handle-tape {
        font-size: 5px;
        padding: 1px 2px;
      }
      .link-item.disabled .link-label::after {
        content: ' · SOON';
        font-size: 0.4em;
      }
      .link-item.demo .link-label::after {
        content: ' · DEMO';
        font-size: 0.4em;
      }
      .avatar {
        width: 32px;
        height: 32px;
      }
      .profile h1 {
        font-size: 12px;
      }
      .philosophy-tagline {
        font-size: 7px;
      }
      .privacy-notice p {
        font-size: 6px;
      }
      .category-divider {
        font-size: 5px;
        margin: 1px 0;
      }
    }

    /* ---------- LANDSCAPE ---------- */
    @media (orientation: landscape) and (max-height: 500px) {
      .avatar {
        width: clamp(32px, 5vh, 48px);
        height: clamp(32px, 5vh, 48px);
      }
      .profile h1 {
        font-size: clamp(14px, 1.8vh, 20px);
      }
      .philosophy-tagline {
        font-size: clamp(9px, 1vh, 12px);
      }
      .link-item {
        min-height: clamp(28px, 3.5vh, 40px);
        padding: clamp(3px, 0.4vh, 8px) clamp(6px, 0.8vw, 12px);
        font-size: clamp(10px, 1.1vh, 14px);
      }
      .link-handle-tape {
        font-size: clamp(6px, 0.5vh, 9px);
      }
      .profile {
        padding-top: clamp(8px, 1.2vh, 16px);
        gap: clamp(1px, 0.2vh, 4px);
        padding: clamp(8px, 1.2vh, 16px) clamp(12px, 1.8vh, 24px) clamp(6px, 0.8vh, 12px);
      }
      .profile .tape-top {
        width: clamp(18px, 3vw, 32px);
        height: clamp(8p
