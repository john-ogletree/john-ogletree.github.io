<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>John Ogletree · Universal</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(2px, 2vh, 3vw);
            margin: 0;
            overflow-x: hidden;
        }

        /* ---------- CONTAINER ---------- */
        .container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(2px, 1.5vh, 2.5vw);
        }

        /* ---------- UTILITY CLASSES ---------- */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-row { flex-direction: row; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: clamp(1px, 0.3vh, 0.5vw); }
        .gap-2 { gap: clamp(2px, 0.6vh, 1vw); }
        .gap-3 { gap: clamp(3px, 1vh, 1.5vw); }
        .gap-4 { gap: clamp(4px, 1.5vh, 2vw); }
        .gap-5 { gap: clamp(5px, 2vh, 2.5vw); }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .w-full { width: 100%; }
        .flex-shrink-0 { flex-shrink: 0; }
        .flex-1 { flex: 1; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ---------- TYPOGRAPHY - scales everywhere ---------- */
        .text-white { color: #ffffff; }
        .text-muted { color: #8b949e; }
        .text-orange { color: #d29922; }
        .font-bold { font-weight: 700; }
        .font-mono { font-family: 'Courier New', Courier, monospace; }
        .leading-tight { line-height: 1.2; }
        .leading-normal { line-height: 1.5; }

        /* Font sizes that scale from watch to 4K */
        .text-xs { font-size: clamp(4px, 0.6vh, 0.9vw); }
        .text-sm { font-size: clamp(5px, 0.8vh, 1.1vw); }
        .text-base { font-size: clamp(6px, 1vh, 1.3vw); }
        .text-lg { font-size: clamp(8px, 1.8vh, 2.5vw); }
        .text-xl { font-size: clamp(10px, 2.5vh, 3.5vw); }
        .text-2xl { font-size: clamp(12px, 3.5vh, 5vw); }
        .text-3xl { font-size: clamp(16px, 5vh, 7vw); }

        /* ---------- SPACING & SIZING - scales everywhere ---------- */
        .p-1 { padding: clamp(1px, 0.2vh, 0.3vw); }
        .p-2 { padding: clamp(2px, 0.4vh, 0.6vw); }
        .p-3 { padding: clamp(3px, 0.6vh, 1vw); }
        .p-4 { padding: clamp(4px, 1vh, 1.5vw); }
        .mt-1 { margin-top: clamp(1px, 0.3vh, 0.5vw); }
        .mt-2 { margin-top: clamp(2px, 0.6vh, 1vw); }
        .mt-3 { margin-top: clamp(3px, 1vh, 1.5vw); }
        .mt-4 { margin-top: clamp(4px, 1.5vh, 2vw); }
        .mb-1 { margin-bottom: clamp(1px, 0.3vh, 0.5vw); }
        .mb-2 { margin-bottom: clamp(2px, 0.6vh, 1vw); }
        .mb-3 { margin-bottom: clamp(3px, 1vh, 1.5vw); }
        .mb-4 { margin-bottom: clamp(4px, 1.5vh, 2vw); }

        /* Avatar - scales from 12px to 180px */
        .avatar {
            width: clamp(12px, 8vh, 180px);
            height: clamp(12px, 8vh, 180px);
            border-radius: 50%;
            object-fit: cover;
            border: clamp(0.5px, 0.15vh, 3px) solid rgba(210, 153, 34, 0.4);
            background: #1f2429;
            flex-shrink: 0;
        }

        /* Status dot */
        .dot {
            width: clamp(3px, 0.6vh, 10px);
            height: clamp(3px, 0.6vh, 10px);
            border-radius: 50%;
            background: #d29922;
            display: inline-block;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* ---------- BADGE ---------- */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: clamp(2px, 0.3vh, 0.6vw);
            background: rgba(210, 153, 34, 0.12);
            color: #d29922;
            border: clamp(0.3px, 0.08vh, 1.5px) solid rgba(210, 153, 34, 0.2);
            padding: clamp(1px, 0.2vh, 0.5vw) clamp(3px, 0.6vh, 1.2vw);
            border-radius: 9999px;
            font-size: clamp(4px, 0.6vh, 0.9vw);
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* ---------- LINK GRID - responsive columns ---------- */
        .link-grid {
            display: grid;
            gap: clamp(2px, 0.5vh, 1vw);
            flex: 1;
            align-content: start;
        }

        /* Default: 6 columns for 4K and large screens */
        .link-grid {
            grid-template-columns: repeat(6, 1fr);
        }

        /* 4K TVs (3840px+) */
        @media (min-width: 3840px) {
            .link-grid { grid-template-columns: repeat(8, 1fr); gap: 1.2vw; }
        }

        /* Large desktop (1920px - 3839px) */
        @media (min-width: 1920px) and (max-width: 3839px) {
            .link-grid { grid-template-columns: repeat(6, 1fr); }
        }

        /* Desktop (1024px - 1919px) */
        @media (min-width: 1024px) and (max-width: 1919px) {
            .link-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* Tablet (768px - 1023px) */
        @media (min-width: 768px) and (max-width: 1023px) {
            .link-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* Large phone (481px - 767px) */
        @media (min-width: 481px) and (max-width: 767px) {
            .link-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Small phone (320px - 480px) */
        @media (max-width: 480px) {
            .link-grid { grid-template-columns: repeat(2, 1fr); }
            .profile-row { flex-direction: column !important; align-items: center !important; text-align: center !important; }
            .profile-text { align-items: center !important; text-align: center !important; }
        }

        /* Watch (under 200px) */
        @media (max-width: 200px) {
            .link-grid { grid-template-columns: repeat(3, 1fr); gap: 2px; }
            .profile-row { flex-direction: row !important; align-items: center !important; text-align: left !important; }
            .profile-text { align-items: flex-start !important; text-align: left !important; }
            .badge { font-size: 4px; padding: 1px 3px; }
            .footer { flex-direction: column; align-items: center; text-align: center; gap: 1px; }
        }

        /* Very small watch (under 150px) */
        @media (max-width: 150px) {
            .link-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5px; }
            .badge { display: none; }
            .footer { font-size: 3.5px; }
        }

        /* Tiny watch (under 130px) */
        @media (max-width: 130px) {
            .link-grid { grid-template-columns: repeat(2, 1fr); gap: 1px; }
            .footer { display: none; }
            .profile-row { gap: 2px; }
        }

        /* ---------- LINK ITEMS ---------- */
        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: clamp(0.3px, 0.08vh, 1.5px) solid #30363d;
            border-radius: clamp(2px, 0.6vh, 16px);
            padding: clamp(1px, 0.4vh, 1.2vw) clamp(1px, 0.4vh, 1.2vw);
            text-decoration: none;
            color: #c9d1d9;
            transition: background 0.2s, transform 0.1s;
            min-height: clamp(14px, 4vh, 80px);
            gap: clamp(1px, 0.2vh, 0.5vw);
        }

        .link-item:hover {
            background: rgba(210, 153, 34, 0.08);
            border-color: #d29922;
        }

        .link-item:active {
            background: rgba(210, 153, 34, 0.15);
            transform: scale(0.95);
        }

        .link-icon {
            font-size: clamp(6px, 1.5vh, 3vw);
            line-height: 1;
            flex-shrink: 0;
        }

        .link-label {
            font-size: clamp(3.5px, 0.5vh, 1vw);
            opacity: 0.8;
            text-align: center;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            border-top: clamp(0.3px, 0.08vh, 1.5px) solid #30363d;
            padding-top: clamp(1px, 0.4vh, 1vw);
            font-size: clamp(3.5px, 0.5vh, 0.8vw);
            color: #8b949e;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: space-between;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .footer a {
            color: #8b949e;
            text-decoration: none;
        }

        .footer a:hover {
            color: #d29922;
        }

        /* ---------- ROUND WATCH SUPPORT ---------- */
        @supports (padding: max(0px)) {
            body {
                padding: max(clamp(2px, 1vh, 2vw), env(safe-area-inset-top)) 
                         max(clamp(2px, 1vh, 2vw), env(safe-area-inset-right)) 
                         max(clamp(2px, 1vh, 2vw), env(safe-area-inset-bottom)) 
                         max(clamp(2px, 1vh, 2vw), env(safe-area-inset-left));
            }
        }

        /* ---------- PREVENT SCROLL ON WATCH ---------- */
        @media (max-width: 200px) {
            html, body { overflow: hidden; }
        }
    </style>
</head>
